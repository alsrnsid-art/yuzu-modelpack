# YUZU.mix 정리 (한 번 쓰고 지울 작업)
#   - yuzu_models_1 / 2 에 똑같이 있는 파일 빼기
#   - war3mapImported\war3mapImported 처럼 잘못된 자리에 들어간 복사본 빼기 (맞는 자리에 이미 있는 것)
#   - 맵 / 모델이 부르는 자리로 옮기기
#   원본 YUZU.mix 해시가 다르면 (그사이 새로 올렸으면) 아무것도 안 하고 멈춤
name: yuzu-mix-fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/yuzu_fix/**', '.github/workflows/yuzu-fix.yml']

permissions:
  contents: write

concurrency:
  group: yuzu-mix-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SRC_SHA: 4dcca53edfce85f61b9e6963535e77815e79a5dc38bf97394f7e096f425ae10c
    steps:
      - uses: actions/checkout@v4

      - name: StormLib 설치
        run: sudo apt-get update -q && sudo apt-get install -y -q libstorm9

      - name: 지금 올라가 있는 YUZU.mix / manifest 받기
        run: |
          gh release download pack -R "$GITHUB_REPOSITORY" -p YUZU.mix -p manifest.json -D src
          echo "$SRC_SHA  src/YUZU.mix" | sha256sum -c -

      - name: 정리해서 새로 묶기 + 확인
        run: |
          python3 .github/yuzu_fix/rebuild.py src/YUZU.mix YUZU.mix .github/yuzu_fix/plan.tsv
          python3 .github/yuzu_fix/verify_mix.py YUZU.mix .github/yuzu_fix/expect.tsv
          ls -l src/YUZU.mix YUZU.mix

      - name: manifest 고치기
        run: |
          SHA=$(sha256sum YUZU.mix | cut -d' ' -f1)
          SIZE=$(stat -c %s YUZU.mix)
          VER=$(TZ=Asia/Seoul date +%F)
          jq --arg s "$SHA" --argjson z "$SIZE" --arg v "$VER" \
            '.version=$v | (.files[] | select(.name=="YUZU.mix")) |= (.sha256=$s | .size=$z)' src/manifest.json > manifest.json
          cat manifest.json

      - name: 릴리스에 올리기 (제목은 그대로)
        run: |
          gh release upload pack YUZU.mix --clobber -R "$GITHUB_REPOSITORY"
          gh release upload pack manifest.json --clobber -R "$GITHUB_REPOSITORY"
