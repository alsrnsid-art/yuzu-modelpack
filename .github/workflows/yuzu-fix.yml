# YUZU.mix 앞머리 (3072 바이트 실행 부분) 되살리기 (한 번 쓰고 지울 작업)
#   정리할 때 앞머리가 빠져 War3 가 "잘못된 이미지 (0xc000012f)" 를 띄움 -> 원래 앞머리 + 정리한 MPQ 로 다시 올림
name: yuzu-mix-fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/yuzu_fix/**', '.github/workflows/yuzu-fix.yml']

permissions:
  contents: write

concurrency:
  group: yuzu-mix-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SRC_SHA: c30052ccfe22b93c812a5060b5c839d40fb5b396bc7f05b5fbfb01e238277291
      STUB_MD5: 56ff609341d1859381e8efdb83f16a5f
    steps:
      - uses: actions/checkout@v4

      - name: StormLib 설치
        run: sudo apt-get update -q && sudo apt-get install -y -q libstorm9 smpq

      - name: 지금 YUZU.mix / manifest 받기
        run: |
          gh release download pack -R "$GITHUB_REPOSITORY" -p YUZU.mix -p manifest.json -D src
          echo "$SRC_SHA  src/YUZU.mix" | sha256sum -c -

      - name: 앞머리 붙이기 + 확인
        run: |
          base64 -d .github/yuzu_fix/stub.b64 > stub.bin
          echo "$STUB_MD5  stub.bin" | md5sum -c -
          test "$(stat -c %s stub.bin)" = 3072
          head -c 2 src/YUZU.mix | od -c
          cat stub.bin src/YUZU.mix > YUZU.mix
          head -c 2 YUZU.mix | grep -q MZ
          N=$(smpq -l YUZU.mix | wc -l); echo "files $N"; test "$N" -ge 8400
          ls -l src/YUZU.mix YUZU.mix

      - name: manifest 고치기
        run: |
          SHA=$(sha256sum YUZU.mix | cut -d' ' -f1)
          SIZE=$(stat -c %s YUZU.mix)
          jq --arg s "$SHA" --argjson z "$SIZE" \
            '(.files[] | select(.name=="YUZU.mix")) |= (.sha256=$s | .size=$z)' src/manifest.json > manifest.json
          cat manifest.json

      - name: 릴리스에 올리기 (제목은 그대로)
        run: |
          gh release upload pack YUZU.mix --clobber -R "$GITHUB_REPOSITORY"
          gh release upload pack manifest.json --clobber -R "$GITHUB_REPOSITORY"
